services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: portfoliolab
      POSTGRES_PASSWORD: portfoliolab
      POSTGRES_DB: portfoliolab
    ports:
      - "54330:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfoliolab"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
