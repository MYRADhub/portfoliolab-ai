name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: portfoliolab
          POSTGRES_PASSWORD: portfoliolab
          POSTGRES_DB: portfoliolab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfoliolab"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://portfoliolab:portfoliolab@localhost:5432/portfoliolab
      ANALYTICS_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @portfolio-lab/web build
  analytics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analytics
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest
